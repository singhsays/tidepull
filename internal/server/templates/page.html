<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tidepull status</title>
<script src="/assets/htmx.min.js"></script>
<style>
	body { font-family: system-ui, sans-serif; margin: 2rem; color: #1a1a2e; }
	h1 { font-size: 1.4rem; }
	table { border-collapse: collapse; width: 100%; max-width: 72rem; table-layout: fixed; }
	th, td { border: 1px solid #c8c8d0; padding: 0.45rem 0.7rem; text-align: left; vertical-align: top; box-sizing: border-box; }
	th { background: #eef0f4; }
	th:nth-child(1) { width: 28%; }
	th:nth-child(2) { width: 17%; }
	th:nth-child(3) { width: 11%; }
	th:nth-child(4) { width: 11%; }
	th:nth-child(5) { width: 7%; }
	th:nth-child(6) { width: 10%; }
	td.error { color: #b00020; font-weight: 600; }
	span.error, td.actions button { color: #b00020; }
	span.ok { color: #1b6b34; }
	td.pending { color: #6b6b78; font-style: italic; }
	pre.errtext { margin: 0.3rem 0 0; white-space: pre-wrap; color: #b00020; font-weight: 400; }
	.sub { font-size: 0.8rem; color: #6b6b78; }
	td.account .sub { margin-left: 0.3rem; font-weight: 400; }
	td.account .provicon svg { vertical-align: -3px; }
	td.account .paths { font-size: 0.78rem; color: #6b6b78; margin-top: 3px; line-height: 1.4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
	td.account .paths svg { vertical-align: -2px; }
	td.account .dir { margin: 0 4px; color: #6b6b78; }
	td.actions form.inline { display: inline; margin-left: 0.5rem; }
	td.actions button { background: none; border: none; padding: 0; font: inherit; cursor: pointer; }
	footer { margin-top: 1.5rem; font-size: 0.85rem; color: #6b6b78; }
	a { color: #1b4db1; }
</style>
</head>
<body>
<h1>tidepull status</h1>
{{template "fragment" .Rows}}
<footer>tidepull {{.Version}} · up {{.Uptime}}</footer>

{{define "folderIcon"}}<svg role="img" viewBox="0 0 24 24" width="13" height="13" fill="currentColor" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M10 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg>{{end}}
</body>
</html>
