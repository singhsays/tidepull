# tidepull config — example
# Copy to $XDG_CONFIG_HOME/tidepull/config.yaml or pass it with -c.
# Each account is one sync job: a remote folder pulled into a local
# directory on its own interval.
#
# OAuth tokens and sync state are stored in
# $XDG_DATA_HOME/tidepull/state.db.

defaults:
  interval: 30s

accounts:
  - name: photos
    provider: google
    # OAuth client credentials as JSON: client_id and client_secret.
    # For Google, point this at the downloaded client-secret JSON.
    credentials-file: /run/secrets/tidepull-photos-credentials
    # scopes override the provider defaults:
    # scopes:
    #   - https://www.googleapis.com/auth/drive.readonly
    # exclude adds MIME types to skip, in addition to the provider's
    # own exclusions for formats it cannot sync:
    # exclude:
    #   - text/csv
    # export enables exporting provider-native document types; keys and
    # targets are provider-specific (google: document, spreadsheet,
    # presentation, drawing):
    # export:
    #   document: text/plain
    #   spreadsheet: text/csv
    # on-deletion controls what happens to the local copy when a file
    # is removed from the remote (default: delete, mirroring the remote
    # tree). "archive" moves the copy into the account's
    # .tidepull-archive directory, one UTC-timestamped folder per
    # deletion, with the original relative path preserved. Archived
    # copies are never cleaned up; delete them when you no longer want
    # them.
    # on-deletion: archive
    # Empty folder-id pulls the account's root.
    folder-id: 1AbCdEf_GhiJkLmNoPqRsTuVwXyZ
    local-dir: /srv/photos
    interval: 30s

  - name: documents
    provider: google
    credentials-file: /run/secrets/tidepull-documents-credentials
    local-dir: /srv/documents

  # Dropbox account. folder-id is the path of the folder to sync (or
  # empty for the whole Dropbox); OAuth client from the Dropbox App
  # Console with the files.metadata.read and files.content.read scopes.
  - name: notes
    provider: dropbox
    # Dropbox: a JSON file with client_id (the App key) and
    # client_secret (the App secret).
    credentials-file: /run/secrets/tidepull-notes-credentials
    local-dir: /srv/notes
    folder-id: /Notes
    # Dropbox requires the redirect URI to match a pre-registered one:
    # register http://127.0.0.1:53683/ in the app and pin the port here.
    redirect-port: 53683
